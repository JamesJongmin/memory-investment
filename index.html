      +   'MU EPS: 2027 $155 · 2028 $167 · 2029 $117. FCF $4,000억+.<br/><br/>'
      +   'SK하이닉스: 31조 팹 투자 제안 거절 = "슈퍼을". OPM 72% + 자체 21조 투자. ADR 발행 추진 → 선진시장 밸류에이션.<br/>'

  function renderCatalyst(){
    var groups = [
      ["즉각적","var(--red)",["MS \"Chipflation\" 리포트 (6/4) — TAM $2,200억→$8,900억 (4배)","MS MU TP $520→$1,050, SNDK $1,100→$1,750 상향","Kioxia Investor Day (6/2) — ADR 상장 + 주주환원 강화","Nanya 5월 매출 +730% YoY · 7개월 연속 최고"]],
      ["7–8월","var(--indigo)",["BofA: Agentic AI 서버 CPU TAM 2030 $170B+(+37% CAGR) — AMD $560·Intel Buy 상향·NVDA $350","MS: DRAM 8월분기 +15% 추가 상승 전망","NVDA Vera CPU 독립 랙·AMD Venice 256코어 2H26 → 서버 DDR5 수요","SK하이닉스 ADR (NYSE) — 20–30% 프리미엄","SOX 편입 가능성 → 패시브 자금 유입"]],
      ["2026 하반기","var(--amber)",["삼성 3개년 환원 정책 (FCF 50%) 발표 — 자사주/배당 비중 결정","HBM 계약 갱신 (대규모 LTA 가시화)","OpenAI 등 하이퍼스케일러 2027~28년분 확보 본격화","미시간 셀린 DC 가동 → 추가 수요 가시화"]],
      ["2027–32","var(--green)",["SK하이닉스 3개년 환원 결과 발표 (2027말)","MU 2027~ 대규모 자사주 매입 (MS)","HBM4e YoY +70–100% (미즈호)","Capex CY27 $1조 → CY30 $3–4조","OpenAI: 2030·31·32년 컴퓨팅 선제 확보 경쟁"]]
    ];
    var html = '<div class="box">'
      + '<p class="box-title">실적 · LTA · ADR</p>'
      + '<p class="box-sub">시간축으로 본 주가 촉매.</p>';
    groups.forEach(function(g){
      html += '<div class="cat-group"><span class="badge" style="background:'+g[1]+';">'+esc(g[0])+'</span>'
        + '<div class="cat-items">';
      g[2].forEach(function(it){
        html += '<div class="cat-item"><span class="arrow">→</span><p class="txt">'+esc(it)+'</p></div>';
      });
      html += '</div></div>';
    });
    html += '</div>';
    return html;
  }

  function renderSell(){
    var SM = d.signalMeta || {};
    function meta(k, defT, defN){ var x = SM[k] || {}; return { t: x.name || defT, th: x.threshold || "", now: x.now || defN }; }
    var t1s = [
      {em:"📦", k:"s1", ok:d.signals.s1, dt:"DRAM 재고 8주+", dn:"2–3주"},
      {em:"📉", k:"s2", ok:d.signals.s2, dt:"계약가 QoQ 하락", dn:"+58~63%"},
      {em:"🏗️", k:"s3", ok:d.signals.s3, dt:"3사 Capex 공격 전환", dn:"질서있는 증설"}
    ];
    var t2s = [
      {em:"💰", k:"t1", ok:d.signals.t1, dt:"빅4 Capex 하향", dn:"상향 지속"},
      {em:"🇨🇳", k:"t2", ok:d.signals.t2, dt:"CXMT 대량 출하", dn:"캐파 정체"},
      {em:"📊", k:"t3", ok:d.signals.t3, dt:"멀티플 de-rating", dn:"재평가 진행"}
    ];
    function sigRow(s){
      var mm = meta(s.k, s.dt, s.dn);
      return '<div class="sig-row"><div class="sig-flex">'
        + '<div class="sig-emoji">'+s.em+'</div>'
        + '<div style="flex:1;"><p class="sig-t">'+esc(mm.t)+'</p>'
        + (mm.th ? '<p style="font-size:10px;color:var(--ink-4);margin:3px 0 0;letter-spacing:-0.005em;">기준: '+esc(mm.th)+'</p>' : '')
        + '<p class="'+(s.ok?'sig-now-ok':'sig-now-warn')+'">'+(s.ok ? '현재 '+esc(mm.now) : '경고 — '+esc(mm.now))+'</p></div>'
        + '<span class="sig-pill '+(s.ok?'ok':'warn')+'">'+(s.ok?'OK':'WARN')+'</span>'
        + '</div></div>';
    }
    var html = '<div class="box">'
      + '<p class="box-title">매도 시그널</p>'
      + '<p class="box-sub">기본 홀딩. <strong style="color:var(--red);">TIER 1 × 2개+</strong> 시 비중 축소. 판정은 일일 작업이 측정 데이터 기준으로 자동 갱신.</p>'
      + '<div style="margin-bottom:12px;"><span class="badge" style="background:var(--red);">TIER 1</span></div>';
    t1s.forEach(function(s){ html += sigRow(s); });
    html += '<div style="margin:20px 0 12px;"><span class="badge" style="background:var(--amber);">TIER 2</span></div>';
    t2s.forEach(function(s){ html += sigRow(s); });
    var ycs = d.yellowCards || [];
    var yOn = ycs.filter(function(y){return y.on;}).length;
    if (ycs.length) {
      html += '<div style="margin:20px 0 12px;"><span class="badge" style="background:var(--gold);color:#08090B;">옐로카드 · 선행 경고</span></div>';
      ycs.forEach(function(y){
        html += '<div class="tier2-row"><div class="sig-emoji">'+(y.on?'🟡':'⚪')+'</div>'
          + '<div style="flex:1;"><p style="font-size:12.5px;font-weight:600;margin:0;color:var(--ink);letter-spacing:-0.008em;">'+esc(y.name)+'</p>'
          + '<p style="font-size:10.5px;color:var(--ink-3);margin:3px 0 0;line-height:1.5;">'+esc(y.now)+'</p></div>'
          + '<span class="sig-pill '+(y.on?'warn':'ok')+'">'+(y.on?'관찰':'미발동')+'</span></div>';
      });
    }
    html += '<div class="verdict '+(allClear?'clear':'warn')+'">'
      + '<p style="font-size:14px;font-weight:700;margin:0;color:'+(allClear?'var(--green)':'var(--red)')+';letter-spacing:-0.012em;">'+(allClear?'✓ 전 시그널 클리어':'⚠ TIER 1 경고 '+t1Count+'개')+'</p>'
      + '<p style="font-size:11.5px;color:var(--ink-2);margin:5px 0 0;letter-spacing:-0.005em;">'+(allClear?'풀 홀딩 유지':(t1Count>=2?'30–50% 비중 축소 검토':'추가 매수 중단'))+(yOn?' · 옐로카드 '+yOn+'개 관찰 중':'')+'</p>'
      + '</div>';
    html += '</div>';
    return html;
  }

  function renderFunding(){
    var ff = d.fundingFlags || [];
    function lc(l){ return l==='green'?'var(--green)':(l==='stress'||l==='red')?'var(--red)':'var(--amber)'; }
    function ls(l){ return l==='green'?'var(--green-soft)':(l==='stress'||l==='red')?'var(--red-soft)':'var(--amber-soft)'; }
    function ll(l){ return l==='green'?'OK':(l==='stress'||l==='red')?'STRESS':(l==='watch'?'관찰':'주의'); }
    function le(l){ return l==='green'?'🟢':(l==='stress'||l==='red')?'🔴':(l==='watch'?'🔭':'🟡'); }
    var rows = ff.map(function(f){
      return '<div class="sig-row"><div class="sig-flex">'
        + '<div class="sig-emoji">'+le(f.level)+'</div>'
        + '<div style="flex:1;"><p class="sig-t">'+esc(f.name)+'</p>'
        + '<p style="font-size:10.5px;color:var(--ink-3);margin:4px 0 0;line-height:1.55;letter-spacing:-0.005em;">'+esc(f.now)+'</p></div>'
        + '<span class="sig-pill" style="background:'+ls(f.level)+';color:'+lc(f.level)+';">'+ll(f.level)+'</span>'
        + '</div></div>';
    }).join("");
    var fv = d.fundingVerdict;
    return '<div class="box">'
      + '<p class="box-title">AI 펀딩 · 신용 스트레스</p>'
      + '<p class="box-sub">메모리 수요의 자금 토대를 추적. <strong style="color:var(--amber);">YELLOW=모니터링</strong>일 뿐 행동 트리거 아님. 진짜 sell 트리거는 빅4 capex 가이던스 하향(매도 탭 t1).</p>'
      + rows
      + (fv ? '<div class="verdict" style="background:var(--amber-soft);border:1px solid rgba(180,83,9,0.18);margin-top:18px;">'
          + '<p style="font-size:14px;font-weight:700;margin:0;color:var(--amber);letter-spacing:-0.012em;">'+esc(fv.title)+'</p>'
          + '<p style="font-size:11.5px;color:var(--ink-2);margin:5px 0 0;letter-spacing:-0.005em;">'+esc(fv.body)+'</p></div>' : '')
      + '</div>';
  }

  function renderBody(){
    if (activeTab==="thesis") return renderThesis();
    if (activeTab==="price") return renderPrice();
    if (activeTab==="demand") return renderDemand();
    if (activeTab==="supply") return renderSupply();
    if (activeTab==="shift") return renderShift();
    if (activeTab==="catalyst") return renderCatalyst();
    if (activeTab==="sell") return renderSell();
    if (activeTab==="funding") return renderFunding();
    return "";
  }

  function render(){
    var tabsHtml = tabs.map(function(t){
      return '<button class="tab'+(t.id===activeTab?' active':'')+'" data-tab="'+t.id+'">'+esc(t.label)+'</button>';
    }).join("");
    document.getElementById("tabsRoot").innerHTML = tabsHtml;

    var bodyHtml = '<div class="meta"><span class="badge-dot"></span><span><strong style="color:var(--ink);">데이터 v'+d.dataVersion+'</strong> · 최종 '+esc(d.lastUpdate)+' · 매일 갱신은 로컬 thesis-data.json에서 진행</span></div>'
      + renderBody();
    document.getElementById("root").innerHTML = bodyHtml;

    document.querySelectorAll(".tab").forEach(function(btn){
      btn.addEventListener("click", function(){
        activeTab = btn.getAttribute("data-tab");
        openWave = null;
        render();
      });
    });
    document.querySelectorAll(".wave").forEach(function(w){
      w.addEventListener("click", function(){
        var id = w.getAttribute("data-wave");
        openWave = (openWave===id) ? null : id;
        render();
      });
    });
  }

  render();
}

  s.onerror = start;  /* fall back to inline snapshot */
